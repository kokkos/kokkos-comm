name: Linux

# only run most recent workflow in branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths-ignore:
    - README.md
    - 'docs/**'
    types: [ opened, reopened, synchronize ]

jobs:
   Kokkos-master-OpenMPI-OpenMP-Release:
    env:
      KOKKOS_SRC: ${{ github.workspace }}/_deps/kokkos
      KOKKOS_BUILD: ${{ github.workspace }}/_deps/kokkos-build
      KOKKOS_INSTALL: ${{ github.workspace }}/_deps/kokkos-install
      COMM_SRC: ${{ github.workspace }}
      COMM_BUILD: ${{ github.workspace }}/build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Install MPI & dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y libopenmpi-dev openmpi-bin cmake
          which mpirun
          mpirun --version
          which mpicxx
          mpicxx --version
          which mpiexec
          mpiexec --version

      - name: Build Kokkos
        run: |
          git clone https://github.com/kokkos/kokkos.git --branch master --depth 1 "$KOKKOS_SRC"
          cmake\
           -S "$KOKKOS_SRC"\
           -B "$KOKKOS_BUILD"\
           -DCMAKE_BUILD_TYPE=Release\
           -DKokkos_ENABLE_SERIAL=ON\
           -DKokkos_ENABLE_OPENMP=ON\
           -DKokkos_ARCH_NATIVE=ON
          cmake --build "$KOKKOS_BUILD" --parallel $(nproc)
          cmake --install "$KOKKOS_BUILD" --prefix "$KOKKOS_INSTALL"

      - name: Build KokkosComm
        run: |
          cmake\
           -S "$COMM_SRC"\
           -B "$COMM_BUILD"\
           -DCMAKE_BUILD_TYPE=Release\
           -DCMAKE_CXX_FLAGS="-Werror"\
           -DKokkos_ROOT="$KOKKOS_INSTALL"\
           -DKokkosComm_BUILD_UNITTESTS=ON\
           -DKokkosComm_BUILD_PERFTESTS=ON
          VERBOSE=1 cmake --build "$COMM_BUILD"
      - name: Test KokkosComm
        run: ctest -V --test-dir "$COMM_BUILD"

   Kokkos-master-MPICH-OpenMP-Debug:
    env:
      KOKKOS_SRC: ${{ github.workspace }}/_deps/kokkos
      KOKKOS_BUILD: ${{ github.workspace }}/_deps/kokkos-build
      KOKKOS_INSTALL: ${{ github.workspace }}/_deps/kokkos-install
      COMM_SRC: ${{ github.workspace }}
      COMM_BUILD: ${{ github.workspace }}/build
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Install MPI & dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y mpich cmake
          which mpirun
          mpirun --version
          which mpicxx
          mpicxx --version
          which mpiexec
          mpiexec --version

      - name: Build Kokkos
        run: |
          git clone https://github.com/kokkos/kokkos.git --branch master --depth 1 "$KOKKOS_SRC"
          cmake\
           -S "$KOKKOS_SRC"\
           -B "$KOKKOS_BUILD"\
           -DCMAKE_BUILD_TYPE=Debug\
           -DKokkos_ENABLE_SERIAL=ON\
           -DKokkos_ENABLE_OPENMP=ON\
           -DKokkos_ARCH_NATIVE=ON
          cmake --build "$KOKKOS_BUILD" --parallel $(nproc)
          cmake --install "$KOKKOS_BUILD" --prefix "$KOKKOS_INSTALL"

      - name: Build KokkosComm
        run: |
          cmake\
           -S "$COMM_SRC"\
           -B "$COMM_BUILD"\
           -DCMAKE_BUILD_TYPE=Debug\
           -DCMAKE_CXX_FLAGS="-Werror"\
           -DKokkos_ROOT="$KOKKOS_INSTALL"\
           -DKokkosComm_BUILD_UNITTESTS=ON\
           -DKokkosComm_BUILD_PERFTESTS=ON
          VERBOSE=1 cmake --build "$COMM_BUILD"

      - name: Test KokkosComm
        run: ctest -V --test-dir "$COMM_BUILD"
